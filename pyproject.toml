[project]
name = "ga-target-game"
version = "0.1.0"
description = "A game based on genetic algorithms to learn Pygame and pymunk"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eric Lucero Gonzalez", email = "ericlucerog@gmail.com" }]
dependencies = [
    "pygame>=2.6.1",
    "pymunk>=7.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pylint>=3",   # incluye pyreverse para diagramas UML
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga_target_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes · I: orden de imports (reemplaza isort) · UP: sintaxis moderna · B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ga_target_game"]

[tool.pylint.main]
# pygame y pymunk son extensiones en C: sin esto pylint no ve sus miembros
# y marca falsos positivos como "Module 'pygame' has no 'init' member" (E1101).
extension-pkg-allow-list = ["pygame", "pymunk"]
